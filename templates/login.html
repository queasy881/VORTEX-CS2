<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX — Dev Portal Login</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#07070d;--card:#0f0f18;--border:#1a1a2e;--text:#c9d1d9;--dim:#5a6070;--bright:#eceff4;--accent:#7eb8f7;--accent2:#82dab0;--red:#f38ba8}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center}
        body::before{content:'';position:fixed;inset:0;
            background:linear-gradient(rgba(126,184,247,.025) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(126,184,247,.025) 1px,transparent 1px);
            background-size:64px 64px;pointer-events:none}
        .login-box{position:relative;z-index:1;width:100%;max-width:400px;padding:24px}
        .login-box h1{font-family:'JetBrains Mono',monospace;font-size:1.3rem;color:var(--bright);margin-bottom:6px;text-align:center}
        .login-box .sub{text-align:center;color:var(--dim);font-size:.88rem;margin-bottom:32px}
        .form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px}
        label{display:block;font-size:.82rem;color:var(--dim);margin-bottom:6px;font-weight:500}
        input[type="text"],input[type="password"]{
            width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);
            border-radius:8px;color:var(--bright);font-family:inherit;font-size:.92rem;
            margin-bottom:20px;outline:none;transition:border-color .2s}
        input:focus{border-color:var(--accent)}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),#6aa3e8);
            color:#07070d;border:none;border-radius:8px;font-size:.95rem;font-weight:600;
            cursor:pointer;font-family:inherit;transition:all .25s}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(126,184,247,.2)}
        .back{display:block;text-align:center;margin-top:20px;color:var(--dim);font-size:.82rem;text-decoration:none}
        .back:hover{color:var(--text)}
        .flash{margin-bottom:16px;padding:10px 16px;border-radius:8px;font-size:.85rem;text-align:center;
            background:rgba(243,139,168,.1);border:1px solid rgba(243,139,168,.2);color:var(--red)}
    </style>
</head>
<body>
<div class="login-box">
    <h1>▸ Dev Portal</h1>
    <p class="sub">Manage releases & downloads</p>
    <div class="form-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}
        <div class="flash">{{ msg }}</div>
        {% endfor %}{% endif %}{% endwith %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required autofocus autocomplete="username">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password">
            <button class="btn" type="submit">Sign In</button>
        </form>
    </div>
    <a class="back" href="/">← Back to site</a>
</div>
</body>
</html>
